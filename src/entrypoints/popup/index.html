<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Shorts Breaker</title>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <img src="/infinite-shorts-breaker.svg" alt="" width="32" height="32" />
      <h1 id="popupTitle">Infinite Shorts Breaker</h1>
    </header>

    <form id="settings" class="card" novalidate>
      <label class="field">
        <span id="viewLimitLabel" class="field__label">View limit</span>
        <span class="field__control">
          <input id="viewLimit" type="number" min="1" step="1" value="5" />
          <span id="viewsUnit" class="field__suffix">views</span>
        </span>
      </label>

      <label class="field">
        <span id="timeLimitLabel" class="field__label">Time limit</span>
        <span class="field__control">
          <input id="timeLimit" type="number" min="1" step="1" value="5" />
          <span id="minutesUnit" class="field__suffix">minutes</span>
        </span>
      </label>

      <button id="saveBtn" type="submit" class="btn">Save</button>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script type="module" src="main.ts"></script>
</body>
</html>
